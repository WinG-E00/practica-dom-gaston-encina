<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body class="d-flex justify-content-center ">


    <main class="d-flex justify-content-center flex-column">
        <div class="container d-flex flex-column ">
            <h1>Super Heroes</h1>
            <div class="btn btn-dark" id="ver_personajes">Ver Todos los personajes</div>
        </div>

        <form id="formularioPersonajes">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Nombre del personaje">
            </div>

            <div class="mb-3">
                <label for="imagen" class="form-label">Imagen</label>
                <input type="url" class="form-control" id="imagen" placeholder="url de tu imagen"></input>
            </div>

            <div>
                <button class="btn btn-primary" type="submit id=" btnSubirPersonaje">Subir Personaje</button>
            </div>
        </form>


        <div class="row" id="row_hero_container"></div>

    </main>




    <script src="./assets/js/app.js"></script>
    <!-- bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
</body>

</html>
